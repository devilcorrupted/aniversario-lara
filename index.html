<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Lara - Início</title>
    <style>
        :root {
            --bg-black: #0A0A0A;
            --card-dark: #141414;
            --accent-red: #8B0000;
            --bright-red: #FF1E1E;
            --text-light: #F5F5F5;
            --text-muted: #A0A0A0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background-color: var(--card-dark); border: 2px solid var(--accent-red); border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(139, 0, 0, 0.3); }
        h1 { font-size: 2.5rem; color: var(--bright-red); margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 30, 30, 0.4); }
        p { font-size: 1.15rem; color: var(--text-light); margin-bottom: 30px; line-height: 1.6; }
        .btn { display: inline-block; background-color: var(--accent-red); color: var(--text-light); padding: 15px 35px; font-size: 1.1rem; font-weight: bold; text-decoration: none; border-radius: 30px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(139, 0, 0, 0.5); border: 1px solid var(--bright-red); }
        .btn:hover { background-color: var(--bright-red); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 30, 30, 0.7); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tens uma surpresa à tua espera...</h1>
        <p>Alguém preparou algo muito especial para ti. Prepara-te e clica no botão abaixo para avançar.</p>
        <!-- AQUI ESTÁ O SEGREDO: Aponta para gostos.html -->
        <a href="gostos.html" class="btn">Continuar a surpresa ➔</a>
    </div>
</body>
</html>
